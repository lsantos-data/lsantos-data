<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>lucas.santos — portfolio</title>
<meta name="description" content="Portfólio interativo de Lucas Santos, Senior Data Analyst & Data Engineer">
<meta name="theme-color" content="#282a36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Dracula */
  --bg: #282a36;
  --bg-dark: #21222c;
  --bg-darker: #191a21;
  --current: #44475a;
  --fg: #f8f8f2;
  --comment: #6272a4;
  --cyan: #8be9fd;
  --green: #50fa7b;
  --orange: #ffb86c;
  --pink: #ff79c6;
  --purple: #bd93f9;
  --red: #ff5555;
  --yellow: #f1fa8c;
  --selection: rgba(68,71,90,.5);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display: "Space Grotesk", system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg-darker);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--selection);color:var(--fg)}

/* VS Code Layout */
.vscode{display:flex;height:100%;flex-direction:column}

/* Titlebar */
.titlebar{display:flex;align-items:center;height:30px;background:var(--bg-darker);padding:0 12px;flex-shrink:0;-webkit-app-region:drag}
.titlebar-dots{display:flex;gap:6px;margin-right:12px}
.titlebar-dot{width:10px;height:10px;border-radius:50%}
.td-r{background:#ff5f57}.td-y{background:#febc2e}.td-g{background:#28c840}
.titlebar-text{flex:1;text-align:center;color:var(--comment);font-size:11px}

/* Main area */
.main{display:flex;flex:1;overflow:hidden}

/* Activity Bar (left icons) */
.actbar{width:48px;background:var(--bg-darker);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex-shrink:0;border-right:1px solid var(--bg-dark)}
.actbar-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:default;position:relative;color:var(--comment);transition:color .12s}
.actbar-icon:hover{color:var(--fg)}
.actbar-icon.active{color:var(--fg)}
.actbar-icon.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--fg);border-radius:1px}
.actbar-icon svg{width:20px;height:20px}
.actbar-spacer{flex:1}

/* Editor area */
.editor{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Tabs */
.tabbar{display:flex;height:34px;background:var(--bg-dark);flex-shrink:0;overflow-x:auto;border-bottom:1px solid var(--bg-darker)}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;color:var(--comment);cursor:pointer;border-right:1px solid var(--bg-darker);white-space:nowrap;transition:all .12s}
.tab:hover{color:var(--fg)}
.tab.active{background:var(--bg);color:var(--fg);border-bottom:1px solid var(--bg)}
.tab-icon{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.tab-icon svg{width:14px;height:14px}
/* Language colors */
.icon-py{color:#3572A5}.icon-sql{color:#e38c00}.icon-sh{color:var(--green)}.icon-yml{color:var(--red)}.icon-json{color:var(--yellow)}.icon-md{color:var(--cyan)}.icon-log{color:var(--orange)}.icon-diff{color:var(--red)}.icon-ai{color:var(--purple)}
.tab-close{margin-left:6px;color:var(--comment);font-size:14px;line-height:1}
.tab-close:hover{color:var(--red)}

/* Terminal panel */
.terminal{flex:1;overflow-y:auto;padding:16px 20px 8px;position:relative;background:var(--bg)}
#coderain{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
.term-content{position:relative;z-index:1}

/* Blocks */
.block{margin-bottom:20px}
.prompt-echo{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.ps1{color:var(--green);font-weight:500}
.ps1-path{color:var(--purple)}
.cmd-text{color:var(--fg)}
.output{margin-top:8px}

/* Input row */
.input-row{display:flex;gap:8px;align-items:baseline;padding:4px 0}
#cmd{background:none;border:none;color:var(--fg);font-family:var(--mono);font-size:13px;width:1ch;min-width:1ch;padding:0;caret-color:transparent;outline:none}
.cursor-block{width:8px;height:1.15em;background:var(--green);margin-left:1px;animation:blink 1s step-end infinite;transform:translateY(2px);transition:background .3s,box-shadow .3s}
.cursor-block.alert{background:var(--red);box-shadow:0 0 8px rgba(255,85,85,.3)}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ══════ RICH OUTPUTS ══════ */

/* whoami */
.whoami-out{padding:16px 0}
.whoami-name{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--fg);animation:glitchIn .4s ease forwards}
.whoami-name .dot{color:var(--pink)}
@keyframes glitchIn{0%{opacity:0;transform:translateX(-6px);filter:blur(4px)}30%{opacity:1;transform:translateX(3px);filter:blur(0)}50%{transform:translateX(-1px)}100%{transform:translateX(0)}}
.whoami-role{font-family:var(--display);font-size:18px;color:var(--comment);margin:4px 0 24px;opacity:0;animation:fadeSlide .4s ease .15s forwards}
.whoami-years{font-size:13px;color:var(--comment);margin-bottom:16px;opacity:0;animation:fadeSlide .4s ease .25s forwards}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;opacity:0;animation:fadeSlide .4s ease .35s forwards}
.tag{font-size:11px;color:var(--cyan);border:1px solid var(--current);padding:4px 12px;border-radius:3px;background:rgba(139,233,253,.06)}
.whoami-status{font-size:14px;color:var(--green);font-family:var(--display);font-weight:500;opacity:0;animation:fadeSlide .4s ease .45s forwards}
.whoami-line{width:60px;height:2px;background:var(--pink);margin-top:24px;opacity:0;transform:scaleX(0);transform-origin:left;animation:lineGrow .6s ease .55s forwards;box-shadow:0 0 10px rgba(255,121,198,.2)}
@keyframes lineGrow{to{opacity:1;transform:scaleX(1)}}

/* project cards */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.proj-card{background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:14px 16px;opacity:0;transform:translateY(8px);animation:cardIn .3s ease forwards;transition:border-color .15s}
.proj-card:hover{border-color:var(--purple)}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.proj-card:nth-child(1){animation-delay:0s}.proj-card:nth-child(2){animation-delay:.06s}.proj-card:nth-child(3){animation-delay:.12s}.proj-card:nth-child(4){animation-delay:.18s}.proj-card:nth-child(5){animation-delay:.24s}
.proj-name{font-size:13px;color:var(--cyan);margin-bottom:6px}
.proj-metric{font-family:var(--display);font-size:24px;font-weight:700;color:var(--fg);margin-bottom:4px;letter-spacing:-.02em}
.proj-metric-unit{font-size:12px;font-weight:400;color:var(--comment)}
.proj-ctx{font-size:12px;color:var(--comment);margin-bottom:8px}
.proj-link{font-size:11px}
.proj-link a{color:var(--purple);text-decoration:none}.proj-link a:hover{text-decoration:underline}
.proj-link .proprietary{color:var(--current)}
.proj-note{font-size:11px;color:var(--comment);margin-top:4px;font-style:italic}

/* narrative */
.narr-title-main{font-family:var(--display);font-size:16px;font-weight:600;color:var(--fg);margin-bottom:14px}
.narr-block{border-left:3px solid var(--current);padding:12px 16px;margin-bottom:10px;border-radius:0 4px 4px 0}
.narr-block.problem{border-left-color:var(--red);background:rgba(255,85,85,.05)}
.narr-block.solution{border-left-color:var(--comment);background:var(--bg-dark)}
.narr-block.result{border-left-color:var(--green);background:rgba(80,250,123,.05)}
.narr-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--comment);margin-bottom:8px}
.narr-block.problem .narr-label{color:var(--red)}.narr-block.result .narr-label{color:var(--green)}
.narr-text{font-size:13px;line-height:1.75}
.narr-big{font-family:var(--display);font-size:32px;font-weight:700;color:var(--green)}
.narr-sub{font-size:13px;color:var(--comment);margin-top:2px}
.narr-footer{font-size:12px;color:var(--current);margin-top:10px;font-style:italic}

/* before/after */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ba-col{background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:16px}
.ba-col.before{border-top:3px solid var(--red)}.ba-col.after{border-top:3px solid var(--green)}
.ba-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.ba-col.before .ba-label{color:var(--red)}.ba-col.after .ba-label{color:var(--green)}
.ba-time{font-family:var(--display);font-size:28px;font-weight:700;margin-bottom:12px}
.ba-col.before .ba-time{color:var(--red)}.ba-col.after .ba-time{color:var(--green)}
.ba-bar-single{height:4px;background:var(--current);border-radius:2px;margin-bottom:4px;overflow:hidden}
.ba-bar-fill{height:100%;border-radius:2px;transform:scaleX(0);transform-origin:left;animation:barGrow .8s cubic-bezier(.22,.61,.36,1) forwards}
.ba-col.before .ba-bar-fill{background:var(--red)}.ba-col.after .ba-bar-fill{background:var(--green)}
.ba-col.after .ba-bar-single:nth-child(1) .ba-bar-fill{animation-delay:.1s}.ba-col.after .ba-bar-single:nth-child(2) .ba-bar-fill{animation-delay:.2s}.ba-col.after .ba-bar-single:nth-child(3) .ba-bar-fill{animation-delay:.3s}.ba-col.after .ba-bar-single:nth-child(4) .ba-bar-fill{animation-delay:.35s}
@keyframes barGrow{to{transform:scaleX(1)}}
.ba-list{font-size:12px;color:var(--comment);line-height:1.9}
.ba-list code{font-size:11px;color:var(--cyan);background:var(--current);padding:1px 5px;border-radius:3px}
.ba-extra{background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:12px 16px;font-size:13px}
.ba-extra strong{color:var(--pink);font-weight:600}

/* validate */
.vp-header{font-size:12px;color:var(--comment);margin-bottom:8px}
.vp-progress{height:3px;background:var(--current);border-radius:2px;margin-bottom:14px;overflow:hidden}
.vp-progress-fill{height:100%;border-radius:2px;width:0%;transition:width .25s ease,background .3s;background:var(--green)}
.vp-progress-fill.warn{background:var(--yellow)}
.vp-check{display:flex;gap:10px;font-size:13px;line-height:1.7;opacity:0;transform:translateX(-4px)}
.vp-check.show{opacity:1;transform:translateX(0);transition:all .2s ease}
.vp-pass{color:var(--green);font-weight:600}.vp-fail{color:var(--red);font-weight:700}
.vp-name{color:var(--fg)}.vp-detail{color:var(--comment)}
.vp-investigate{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--yellow);background:none;border:1px solid var(--yellow);padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .15s}
.vp-investigate:hover{background:rgba(241,250,140,.08)}
.vp-diag{display:none;margin-top:14px;background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:18px}
.vp-diag.open{display:block}
.vp-diag-row{display:grid;grid-template-columns:70px 1fr;gap:8px;font-size:13px;margin-bottom:6px;align-items:baseline}
.vp-diag-label{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.vp-diag-label.symptom{color:var(--yellow)}.vp-diag-label.cause{color:var(--red)}.vp-diag-label.fix{color:var(--green)}
.vp-bars{display:flex;gap:20px;margin:18px 0;align-items:flex-end;height:70px;padding:0 20px}
.vp-bar-item{text-align:center;flex:1}
.vp-bar-rect{width:100%;border-radius:3px 3px 0 0}
.vp-bar-val{font-family:var(--display);font-size:18px;font-weight:700;margin-top:6px}
.vp-arrow{color:var(--comment);font-size:20px;display:flex;align-items:center;justify-content:center;padding-bottom:26px}
.vp-quote{font-family:var(--display);font-size:14px;color:var(--comment);font-style:italic;margin-top:14px;padding-top:12px;border-top:1px solid var(--current)}
.vp-fix-btn{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--green);background:none;border:1px solid var(--green);padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .15s}
.vp-fix-btn:hover{background:rgba(80,250,123,.08)}

/* git log */
.gitlog{list-style:none;padding-left:24px;position:relative}
.gitlog::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--current);border-radius:1px}
.gitlog li{position:relative;padding:4px 0;font-size:13px;opacity:0;transform:translateY(6px);animation:nodeIn .3s ease forwards}
.gitlog li:nth-child(1){animation-delay:0s}.gitlog li:nth-child(2){animation-delay:.06s}.gitlog li:nth-child(3){animation-delay:.12s}.gitlog li:nth-child(4){animation-delay:.18s}.gitlog li:nth-child(5){animation-delay:.24s}.gitlog li:nth-child(6){animation-delay:.3s}.gitlog li:nth-child(7){animation-delay:.36s}.gitlog li:nth-child(8){animation-delay:.42s}
@keyframes nodeIn{to{opacity:1;transform:translateY(0)}}
.gitlog li::before{content:'';position:absolute;left:-24px;top:10px;width:12px;height:12px;background:var(--bg);border:2px solid var(--purple);border-radius:50%}
.gitlog .hash{color:var(--yellow);font-weight:500}.gitlog .msg{color:var(--comment)}
.gitlog-footer{font-size:13px;color:var(--green);margin-top:10px;padding-left:24px;font-weight:500}

/* docker */
.dk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.dk-box{background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:12px 14px;opacity:0;transform:scale(.95);animation:dkUp .3s ease forwards}
.dk-box:nth-child(1){animation-delay:0s}.dk-box:nth-child(2){animation-delay:.1s}.dk-box:nth-child(3){animation-delay:.2s}.dk-box:nth-child(4){animation-delay:.3s}
@keyframes dkUp{to{opacity:1;transform:scale(1)}}
.dk-name{font-weight:600;font-size:14px;color:var(--fg);margin-bottom:2px}
.dk-img{font-size:11px;color:var(--comment);margin-bottom:6px}
.dk-status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px}
.dk-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dk-info{font-size:13px;line-height:1.75;color:var(--comment)}
.dk-info strong{color:var(--fg);font-weight:600}
.dk-info code{font-size:12px;background:var(--current);padding:1px 5px;border-radius:3px;color:var(--green)}
.dk-link{margin-top:8px;font-size:12px}.dk-link a{color:var(--purple);text-decoration:none}.dk-link a:hover{text-decoration:underline}

/* contato json */
.json-wrap{background:var(--bg-dark);border:1px solid var(--current);border-radius:5px;padding:16px 18px}
.json-brace{color:var(--fg)}.json-line{padding-left:20px;font-size:13px;line-height:1.8}
.json-key{color:var(--cyan)}.json-val{color:var(--green)}
.json-line a{color:var(--green);text-decoration:none}.json-line a:hover{text-decoration:underline}

/* neofetch */
.neofetch{display:flex;gap:24px;align-items:flex-start}
.neofetch-ascii{color:var(--purple);font-size:12px;line-height:1.3;flex-shrink:0;white-space:pre}
.neofetch-info{font-size:13px;line-height:1.9}
.neofetch-info .nf-label{color:var(--cyan);font-weight:500}
.neofetch-info .nf-val{color:var(--fg)}
.nf-bar{display:inline-block;height:10px;border-radius:2px;margin-left:4px;vertical-align:middle}
.nf-colors{display:flex;gap:3px;margin-top:8px}
.nf-color{width:18px;height:18px;border-radius:3px}

/* top */
.top-header{font-size:12px;color:var(--comment);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--current)}
.top-row{display:grid;grid-template-columns:40px 1fr 80px 1fr;gap:8px;font-size:13px;line-height:2;align-items:center}
.top-pid{color:var(--comment)}.top-name{color:var(--fg)}.top-status{font-size:11px;font-weight:600}
.top-status.completed{color:var(--green)}.top-status.running{color:var(--yellow)}
.top-bar-bg{height:8px;background:var(--current);border-radius:4px;overflow:hidden}
.top-bar-fill{height:100%;border-radius:4px;background:var(--green);transform:scaleX(0);transform-origin:left;animation:barGrow .6s ease forwards}

/* crontab */
.cron-row{font-size:13px;line-height:2.2}
.cron-schedule{color:var(--yellow);display:inline-block;min-width:160px}
.cron-cmd{color:var(--fg)}
.cron-comment{color:var(--comment);font-size:12px;margin-left:8px}

/* tail -f */
.tail-line{font-size:13px;line-height:1.8;opacity:0}
.tail-line.show{opacity:1;transition:opacity .15s}
.tail-ts{color:var(--comment)}.tail-level{font-weight:600}
.tail-level.info{color:var(--cyan)}.tail-level.success{color:var(--green)}.tail-level.warn{color:var(--yellow)}
.tail-msg{color:var(--fg)}

/* git diff */
.diff-header{font-size:12px;color:var(--comment);margin-bottom:8px}
.diff-file{color:var(--cyan);font-weight:500}
.diff-hunk{color:var(--purple);font-size:12px;margin:8px 0 4px}
.diff-line{font-size:13px;line-height:1.7;padding:1px 8px;border-radius:2px}
.diff-add{color:var(--green);background:rgba(80,250,123,.06)}
.diff-add::before{content:"+ "}
.diff-del{color:var(--red);background:rgba(255,85,85,.06)}
.diff-del::before{content:"- "}
.diff-ctx{color:var(--comment)}
.diff-ctx::before{content:"  "}

/* output link */
.out-link{margin-top:10px;font-size:12px}
.out-link a{color:var(--purple);text-decoration:none}
.out-link a:hover{text-decoration:underline}
.out-link a::before{content:"→ "}

/* airflow dag / medallion workflow */
.wf-header{font-size:12px;color:var(--comment);margin-bottom:4px}
.wf-title{font-family:var(--display);font-size:15px;font-weight:600;color:var(--fg);margin-bottom:14px}
.wf-meta{font-size:11px;color:var(--comment);margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap}
.wf-stages{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:8px}
.wf-arrow{display:flex;align-items:center;color:var(--comment);font-size:16px;padding:0 6px;flex-shrink:0}
.wf-stage{flex:1;min-width:140px;background:var(--bg-dark);border:1px solid var(--current);border-radius:6px;padding:14px;text-align:center;opacity:0;transform:translateY(8px);animation:cardIn .3s ease forwards;transition:border-color .3s,background .3s}
.wf-stage:nth-child(1){animation-delay:0s}.wf-stage:nth-child(3){animation-delay:.15s}.wf-stage:nth-child(5){animation-delay:.3s}.wf-stage:nth-child(7){animation-delay:.45s}.wf-stage:nth-child(9){animation-delay:.6s}
.wf-stage.active{border-color:var(--yellow);background:rgba(241,250,140,.05)}
.wf-stage.done{border-color:var(--green);background:rgba(80,250,123,.05)}
.wf-stage-icon{font-size:18px;margin-bottom:6px}
.wf-stage-name{font-family:var(--mono);font-size:12px;font-weight:600;margin-bottom:4px}
.wf-stage.done .wf-stage-name{color:var(--green)}
.wf-stage.active .wf-stage-name{color:var(--yellow)}
.wf-stage-detail{font-size:11px;color:var(--comment);line-height:1.5}
.wf-stage-status{font-size:10px;font-weight:600;margin-top:6px}
.wf-summary{margin-top:14px;padding:10px 12px;background:var(--bg-dark);border:1px solid var(--current);border-radius:4px;font-size:12px;color:var(--comment);display:none}
.wf-summary.show{display:block}
.wf-summary .wf-ok{color:var(--green);font-weight:600}

/* AI chat simulation */
.ai-chat{background:var(--bg-dark);border:1px solid var(--current);border-radius:6px;padding:16px;max-width:600px}
.ai-chat-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--current)}
.ai-chat-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ai-chat-name{font-family:var(--display);font-size:13px;font-weight:600}
.ai-chat-model{font-size:11px;color:var(--comment)}
.ai-msg{margin-bottom:14px;font-size:13px;line-height:1.75}
.ai-msg-user{color:var(--comment);padding-left:12px;border-left:2px solid var(--current)}
.ai-msg-user::before{content:"lucas: ";color:var(--purple);font-weight:600}
.ai-msg-ai{color:var(--fg)}
.ai-msg-ai code{font-family:var(--mono);font-size:12px;background:var(--current);padding:1px 5px;border-radius:3px;color:var(--cyan)}
.ai-code-block{background:var(--bg-darker);border:1px solid var(--current);border-radius:4px;padding:12px;margin:10px 0;font-size:12px;line-height:1.7;overflow-x:auto}
.ai-code-lang{font-size:10px;color:var(--comment);margin-bottom:6px}

/* help */
.help-row{font-size:13px;line-height:2}
.help-cmd{color:var(--green);display:inline-block;min-width:280px}
.help-desc{color:var(--comment)}
.err-cmd{color:var(--red)}

/* Status bar */
.statusbar{display:flex;align-items:center;height:24px;background:var(--purple);padding:0 12px;flex-shrink:0;font-size:11px;color:var(--fg);gap:16px}
.statusbar-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sb-spacer{flex:1}

/* Chip bar */
.chip-bar{border-top:1px solid var(--current);background:var(--bg-dark);padding:10px 20px 14px;flex-shrink:0}
.chip-hint{font-size:11px;color:var(--current);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--current);padding:6px 12px;border-radius:4px;cursor:pointer;transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--purple);color:var(--purple)}
.chip:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.chip::before{content:"$ ";color:var(--comment)}

a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

@media(max-width:640px){
  .actbar{display:none}
  .tabbar{display:none}
  .terminal{padding:14px 14px 8px}
  .whoami-name{font-size:36px}
  .proj-grid,.ba-grid,.dk-grid{grid-template-columns:1fr}
  .neofetch{flex-direction:column;gap:12px}
  .neofetch-ascii{font-size:10px}
  .top-row{grid-template-columns:30px 1fr 60px 1fr;font-size:12px}
  .help-cmd{min-width:0;display:block}
  .chip{font-size:13px;padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){
  #coderain{display:none}
  .cursor-block{animation:none;opacity:1}
  .vp-check,.proj-card,.gitlog li,.dk-box,.tail-line{opacity:1!important;transform:none!important}
  .ba-bar-fill,.top-bar-fill{transform:scaleX(1)!important}
  .whoami-name,.whoami-role,.whoami-years,.tags,.whoami-status{opacity:1!important;transform:none!important}
  .whoami-line{opacity:1!important;transform:scaleX(1)!important}
  .dk-dot{animation:none}
  *{transition-duration:0s!important;animation-duration:0s!important}
}

// Animate medallion workflow
function animateWorkflow(id,total){
  var d=rm?0:700;
  for(var i=0;i<total;i++){
    (function(idx){
      setTimeout(function(){
        var el=document.getElementById(id+"-s"+idx);
        if(!el)return;
        el.classList.add("active");
        el.querySelector(".wf-stage-status").textContent="running";
        el.querySelector(".wf-stage-status").style.color="var(--yellow)";
        term.scrollTop=term.scrollHeight;
      },idx*d);
      setTimeout(function(){
        var el=document.getElementById(id+"-s"+idx);
        if(!el)return;
        el.classList.remove("active");
        el.classList.add("done");
        el.querySelector(".wf-stage-status").textContent="✓ done";
        el.querySelector(".wf-stage-status").style.color="var(--green)";
        if(idx===total-1){
          var summary=document.getElementById(id+"-summary");
          if(summary)summary.classList.add("show");
        }
        term.scrollTop=term.scrollHeight;
      },idx*d+450);
    })(i);
  }
}

function run(raw){
  if(busy)return;var cmd=raw.trim().replace(/\s+/g," ");if(!cmd)return;var key=cmd.toLowerCase();
  if(key==="clear"){hist.innerHTML="";input.value="";autosize();lastCmd="";return}
  if(key==="▶ run all"||key==="run all"){input.value="";autosize();runAll();return}
  if(key===lastCmd){input.value="";autosize();return}
  var html=null;if(O[key])html=O[key]();
  else{var alt=key.replace(/\/$/,"");for(var k in O){if(O.hasOwnProperty(k)&&k.replace(/\/$/,"")===alt){html=O[k]();break}}}
  if(!html)html='<div class="output"><span class="err-cmd">command not found.</span> <span style="color:var(--comment)">digite <span style="color:var(--green)">help</span> para ver comandos.</span></div>';
  busy=true;input.value="";autosize();
  var block=document.createElement("div");block.className="block";
  block.innerHTML='<div class="prompt-echo"><span class="ps1">❯</span><span class="cmd-text">'+esc(cmd)+'</span></div>'+html;
  hist.appendChild(block);term.scrollTop=term.scrollHeight;
  addTab(cmd);updateStatus(cmd);lastCmd=key;
  setTimeout(function(){busy=false;focusInput()},80);
}
autosize();focusInput();setTimeout(function(){run("whoami")},300);
})();
