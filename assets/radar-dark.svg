<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rtitle-dark rdesc-dark">
  <title id="rtitle-dark">Radar técnico</title>
  <desc id="rdesc-dark">Radar com três anéis. Anel interno (produção): SQL, PySpark/Spark, Databricks, Python/pandas. Anel médio (uso com confiança): AWS S3, Delta Lake, Airflow, Power BI. Anel externo (estudando agora): dbt, DuckDB, MinIO, Docker.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; }
    .ring { fill: none; stroke: #1c2444; stroke-width: 1; }
    .spoke { stroke: #1c2444; stroke-width: 1; }
    .label { fill: #8b95b0; font-size: 15px; }
    .sweep { transform-origin: 300px 300px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { fill: #8b95b0; animation: dotLight 6s linear infinite; }
    @keyframes dotLight { 0% { fill: #00d4ff; } 15% { fill: #8b95b0; } 100% { fill: #8b95b0; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none !important; opacity: 0 !important; }
      .dot { animation: none !important; fill: #c7d0e6 !important; }
    }
  </style>

  <rect width="600" height="600" fill="#0a0e27"/>

  <circle class="ring" cx="300" cy="300" r="80"/>
  <circle class="ring" cx="300" cy="300" r="160"/>
  <circle class="ring" cx="300" cy="300" r="240"/>

  <line class="spoke" x1="300" y1="60" x2="300" y2="540"/>
  <line class="spoke" x1="60" y1="300" x2="540" y2="300"/>
  <line class="spoke" x1="130.3" y1="130.3" x2="469.7" y2="469.7"/>
  <line class="spoke" x1="469.7" y1="130.3" x2="130.3" y2="469.7"/>

  <g class="sweep">
    <line x1="300" y1="300" x2="300" y2="40" stroke="#00d4ff" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- Ring 1 — produção -->
  <circle class="dot" cx="300" cy="220" r="6" style="animation-delay:0s"/>
  <text class="label sans" x="300" y="200" text-anchor="middle">SQL</text>

  <circle class="dot" cx="380" cy="300" r="6" style="animation-delay:1.5s"/>
  <text class="label sans" x="396" y="305" text-anchor="start">PySpark/Spark</text>

  <circle class="dot" cx="300" cy="380" r="6" style="animation-delay:3s"/>
  <text class="label sans" x="300" y="404" text-anchor="middle">Databricks</text>

  <circle class="dot" cx="220" cy="300" r="6" style="animation-delay:4.5s"/>
  <text class="label sans" x="204" y="305" text-anchor="end">Python/pandas</text>

  <!-- Ring 2 — confiança -->
  <circle class="dot" cx="413.1" cy="186.9" r="6" style="animation-delay:.75s"/>
  <text class="label sans" x="424" y="182" text-anchor="start">AWS S3</text>

  <circle class="dot" cx="413.1" cy="413.1" r="6" style="animation-delay:2.25s"/>
  <text class="label sans" x="424" y="428" text-anchor="start">Delta Lake</text>

  <circle class="dot" cx="186.9" cy="413.1" r="6" style="animation-delay:3.75s"/>
  <text class="label sans" x="176" y="428" text-anchor="end">Airflow</text>

  <circle class="dot" cx="186.9" cy="186.9" r="6" style="animation-delay:5.25s"/>
  <text class="label sans" x="176" y="182" text-anchor="end">Power BI</text>

  <!-- Ring 3 — estudando -->
  <circle class="dot" cx="300" cy="60" r="6" style="animation-delay:0s"/>
  <text class="label sans" x="300" y="42" text-anchor="middle">dbt</text>

  <circle class="dot" cx="540" cy="300" r="6" style="animation-delay:1.5s"/>
  <text class="label sans" x="556" y="305" text-anchor="start">DuckDB</text>

  <circle class="dot" cx="300" cy="540" r="6" style="animation-delay:3s"/>
  <text class="label sans" x="300" y="564" text-anchor="middle">MinIO</text>

  <circle class="dot" cx="60" cy="300" r="6" style="animation-delay:4.5s"/>
  <text class="label sans" x="44" y="305" text-anchor="end">Docker</text>

  <text x="300" y="592" text-anchor="middle" class="sans" font-size="12" fill="#5b638a">Anel interno: produção · médio: confiança · externo: estudando</text>
</svg>
